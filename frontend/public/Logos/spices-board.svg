<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="sbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="sbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Circular Emblem on the Left -->
  <g transform="translate(15, 10)">
    <!-- Outer green ring -->
    <circle cx="40" cy="40" r="38" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5" />
    <circle cx="40" cy="40" r="34" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="2,2" />
    
    <!-- Central decorative spice motif: Cardamom pod & spice leaf -->
    <!-- Leaf 1 (Left) -->
    <path d="M 40 45 C 30 40 26 28 36 22 C 40 26 42 34 40 45 Z" fill="#15803d" />
    <!-- Leaf 2 (Right) -->
    <path d="M 40 45 C 50 40 54 28 44 22 C 40 26 38 34 40 45 Z" fill="#16a34a" />
    <!-- Central Pod / Star Anise / Stem -->
    <path d="M 40 54 L 40 38" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="40" cy="30" r="4.5" fill="#eab308" stroke="#a16207" stroke-width="1" />
    <circle cx="34" cy="37" r="3" fill="#ca8a04" />
    <circle cx="46" cy="37" r="3" fill="#ca8a04" />
    <circle cx="40" cy="46" r="3.5" fill="#15803d" />
    
    <!-- Mini accent arc -->
    <path d="M 24 52 Q 40 60 56 52" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography on the Right -->
  <g transform="translate(105, 24)">
    <!-- Hindi Subtitle -->
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#166534" letter-spacing="1">स्पाइसेस बोर्ड भारत</text>
    
    <!-- English Main Title -->
    <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#0f172a" letter-spacing="0.5">SPICES BOARD</text>
    
    <!-- Ministry Tagline -->
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" letter-spacing="0.2">Ministry of Commerce &amp; Industry, Govt. of India</text>
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#ea580c" letter-spacing="0.5">COMMERCE &amp; EXPORT PROMOTION</text>
  </g>
</svg>

